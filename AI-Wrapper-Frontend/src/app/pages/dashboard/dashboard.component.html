<div class="dashboard-layout">
  <aside class="sidebar" [class.closed]="!isSidebarOpen">
    <header class="sidebar-header">
      <h3>Uploaded PDFs</h3>
    </header>
    <div class="pdf-list">
      <ul>
        <li *ngFor="let pdf of paginatedPdfs(); let idx = index" class="pdf-item">
          <div class="pdf-entry">
            <a [href]="'http://localhost:5000/' + pdf.filepath" target="_blank">
              {{ getDisplayName(pdf.filename) }}
            </a>
            <button class="menu-button" (click)="openMenu(idx)">⋮</button>
          </div>
          <small>{{ pdf.upload_time }}</small>

          <!-- Popup menu -->
          <div *ngIf="isMenuOpen[idx]" class="popup-menu">
            <button (click)="deletePdf(pdf.file_id)">Delete PDF</button>
            <button (click)="chatArena()">Chat Arena</button>
            <button (click)="viewProperties(pdf)">Properties</button>
          </div>
        </li>
      </ul>

      <!-- Pagination at the bottom -->
      <div class="pagination-controls">
        <button *ngFor="let page of pageNumbers(); let i = index"
                (click)="goToPage(i)"
                [class.active]="i === currentPage">
          {{ page }}
        </button>
      </div>
    </div>
  </aside>

  <main class="main-content">
  <input #fileInput type="file" (change)="onFileSelected($event)" accept=".pdf" hidden>

  <ng-container *ngIf="!selectedPdfForProperties; else propertiesView">
    <div class="upload-card" (click)="fileInput.click()">
      <h2>Welcome to Your Dashboard</h2>
      <div class="plus-icon-container">
        <span class="plus-icon">+</span>
      </div>
      <p class="upload-prompt">Click to upload a new document</p>
    </div>
    <div *ngIf="fileName" class="file-info">
      Selected file: <strong>{{ fileName }}</strong>
    </div>
  </ng-container>

  <ng-template #propertiesView>
    <app-pdf-prop
      [fileId]="selectedPdfForProperties?.file_id"
      [fileName]="getDisplayName(selectedPdfForProperties?.filename)"
      (back)="selectedPdfForProperties = null">
    </app-pdf-prop>
  </ng-template>
</main>
